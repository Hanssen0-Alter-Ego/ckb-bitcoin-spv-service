name: Docker

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
    tags: ["**"]

# A newer build of the same branch supersedes an unfinished one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build linux/${{ matrix.arch }} natively
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        run: printf 'name=%s\n' "${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          platforms: linux/${{ matrix.arch }}
          # Push blobs and a manifest, but do not assign any public image tags yet.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=spv-service-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=spv-service-${{ matrix.arch }}
          build-args: |
            RUST_RELEASE_MODE=release
            CARGO_BUILD_FEATURES=default

      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digest.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        run: printf 'name=%s\n' "${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=branch,suffix=-{{date 'YYYYMMDDHHmm'}}
            type=sha,enable=true,prefix=sha-,format=short
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: digests

      - name: Publish manifest under the existing image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          args=()
          refs=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/docker-digest-$arch/digest.txt")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$IMAGE@$digest")
          done
          [[ "${refs[0]}" != "${refs[1]}" ]]
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(--tag "$tag")
          done <<< "$TAGS"
          # Never create an untagged or partially populated index by mistake.
          (( ${#args[@]} > 0 ))
          while IFS= read -r annotation; do
            [[ -z "$annotation" ]] || args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
